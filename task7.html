<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Layout Page</title>
    <link rel="stylesheet" href="task7.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">



</head>

<body>


    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">MyWebsite</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">

            <div class="col-md-3">
                <div class="sidebar">
                    <h4>Menu</h4>
                    <a href="#">Dashboard</a>
                    <a href="#">Profile</a>
                    <a href="#">Settings</a>
                </div>
            </div>

            <div class="col-md-9">

                <h2 class="text-primary">Dashboard</h2>
                <p>This layout uses Bootstrap grid system (row & columns).</p>

                <div class="row">
                    <div class="col-md-4">
                        <div class="card shadow">
                            <img src="html.jpg" class="card-img-top">
                            <div class="card-body">
                                <h5 class="card-title">HTML</h5>
                                <p class="card-text">hyper text markup language</p>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="card shadow">
                            <img src="boot,jpg.jfif" class="card-img-top">
                            <div class="card-body">
                                <h5 class="card-title">bootstrap</h5>
                                <p class="card-text">framework for css</p>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="card shadow">
                            <img src="css.jpg" class="card-img-top">
                            <div class="card-body">
                                <h5 class="card-title">CSS</h5>
                                <p class="card-text">cascading stylesheet</p>
                            </div>
                        </div>
                    </div>
                </div>

                <h4 class="mt-4">Student Details</h4>
                <table class="table table-bordered table-striped">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Course</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Ravi</td>
                            <td>HTML</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Priya</td>
                            <td>CSS</td>
                        </tr>
                        <tr>
                            <td>3</td>
                            <td>Rahul</td>
                            <td>JavaScript</td>
                        </tr>
                    </tbody>
                </table>

            </div>

        </div>
    </div>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">© 2026 MyWebsite</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
