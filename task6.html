<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="task6.css">

<body>
    <div class="container">
        <h2>register form</h2>
        <form id="userform">
            <label for="name">Name</label>
            <br>
        <input type="text" placeholder="enter the name" id="name">
        <small class="error" id="nameError"></small>

        <br>
       <label for="email">email</label>
        <input type="text" placeholder="enter the email" id="email">
        <small class="error" id="emailError"></small>
        <br>
<label for="phone">phone number</label>
        <input type="text" placeholder="enter the phone number" id="phone">
        <small class="error" id="phoneError"></small><br>
<label for="password">password</label>
        <input type="password" placeholder="enter the password" id="password">
        <small class="error" id="passError"></small>
        <br>
        <button>submit</button>

        
        
    </div>
